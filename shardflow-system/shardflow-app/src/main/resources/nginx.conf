# ShardFlow API Gateway
# Routes: /agent/* → Python推理层, /api/* → Java外围服务

upstream python_inference {
    server python-inference-1:8000 max_fails=3 fail_timeout=30s;
    server python-inference-2:8000 max_fails=3 fail_timeout=30s;
}

upstream java_service {
    server java-service-1:8200 max_fails=3 fail_timeout=30s;
    server java-service-2:8200 max_fails=3 fail_timeout=30s;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=10r/s;
limit_req_zone $http_x_user_id zone=user_limit:10m rate=20r/s;

server {
    listen 80;
    server_name shardflow.local;

    # Redirect to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shardflow.local;

    ssl_certificate     /etc/nginx/certs/shardflow.crt;
    ssl_certificate_key /etc/nginx/certs/shardflow.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Global rate limiting
    limit_req zone=agent_limit burst=20 nodelay;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Health check
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Python推理层 — SSE streaming support
    location /agent/ {
        limit_req zone=user_limit burst=30 nodelay;

        proxy_pass http://python_inference/agent/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject user ID from JWT
        proxy_set_header X-User-Id $http_x_user_id;

        # SSE: disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Timeouts for long-running SSE
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Java外围服务 — REST API
    location /api/ {
        limit_req zone=user_limit burst=30 nodelay;

        proxy_pass http://java_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # JWT validation forwarded to Java service
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $http_x_user_id;

        proxy_read_timeout 30s;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|svg|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

spring:
  application:
    name: shardflow-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shardflow?currentSchema=public&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:shardflow}
    password: ${SPRING_DATASOURCE_PASSWORD:shardflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SF_HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${SF_HIKARI_MIN_IDLE:2}
      connection-timeout: 5000
      initialization-fail-timeout: 10000
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
  rabbitmq:
    host: ${SF_RABBITMQ_HOST:localhost}
    port: ${SF_RABBITMQ_PORT:5672}
    username: ${SF_RABBITMQ_USERNAME:guest}
    password: ${SF_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          max-attempts: 3
          initial-interval: 5000
          multiplier: 3.0
          max-interval: 30000
        auto-startup: ${SF_RABBITMQ_AUTO_STARTUP:true}

server:
  port: ${SF_SYSTEM_SERVER_PORT:8200}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:ShardFlow2026DefaultJwtSecretKeyDoNotUseInProd}

shardflow:
  model-key-master: ${SF_MODEL_KEY_MASTER:c2hhcmRmbG93LWRldi1hZXMta2V5LWRvLW5vdC11c2U=}
  java-api-key: ${SF_JAVA_API_KEY:shardflow}
  minio:
    endpoint: ${SF_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${SF_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${SF_MINIO_SECRET_KEY:minioadmin}
    bucket: ${SF_MINIO_BUCKET:shardflow-kb}
    # Skills 管理 Artifact 存储 Bucket（DR-6）
    skill-bucket: ${SF_MINIO_SKILL_BUCKET:shardflow-skills}
  grpc:
    python-host: ${SF_GRPC_PYTHON_HOST:localhost}
    python-port: ${SF_GRPC_PYTHON_PORT:50051}
    timeout-seconds: 10

  milvus:
    host: ${SF_MILVUS_HOST:localhost}
    port: ${SF_MILVUS_PORT:19530}
    database: ${SF_MILVUS_DATABASE:shardflow_kb}

logging:
  level:
    com.shardflow: ${SF_SYSTEM_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

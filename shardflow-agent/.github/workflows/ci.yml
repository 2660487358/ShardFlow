name: KnowledgeBridge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # Python推理层 — lint, type-check, test
  # =========================================================================
  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shardflow-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app/ tests/
      - name: Type check (mypy)
        run: mypy app/
      - name: Test
        run: pytest tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: shardflow-agent/coverage.xml

  # =========================================================================
  # Java外围服务 — build & test
  # =========================================================================
  java-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shardflow-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build & test
        run: mvn -B verify

  # =========================================================================
  # Frontend — type-check & build
  # =========================================================================
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shardflow-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shardflow-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # =========================================================================
  # Docker build & push (main branch only)
  # =========================================================================
  docker-build:
    needs: [python-test, java-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Python image
        uses: docker/build-push-action@v5
        with:
          context: shardflow-agent
          file: shardflow-agent/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/python-inference:latest
      - name: Build Java image
        uses: docker/build-push-action@v5
        with:
          context: shardflow-system
          push: true
          tags: ghcr.io/${{ github.repository }}/java-service:latest

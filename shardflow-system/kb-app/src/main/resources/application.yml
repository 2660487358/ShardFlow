spring:
  application:
    name: shardflow-system
  datasource:
    url: jdbc:postgresql://localhost:5432/knowledgebridge
    username: knowledgebridge
    password: knowledgebridge
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

logging:
  level:
    com.shardflow: INFO

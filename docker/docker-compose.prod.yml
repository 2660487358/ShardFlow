# Production Docker Compose — ShardFlow full stack
version: "3.9"

services:
  # =========================================================================
  # Python Inference Layer (2 replicas for HA)
  # =========================================================================
  python-inference-1:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - SF_AGENT_APP_ENV=prod
      - SF_AGENT_REDIS_URL=redis://redis-sentinel:26379/0
      - SF_AGENT_JAVA_BASE_URL=http://java-service-1:8200
      - SF_AGENT_LLM_API_KEY=${SF_AGENT_LLM_API_KEY}
      - SF_AGENT_LLM_BASE_URL=${SF_AGENT_LLM_BASE_URL}
      - SF_AGENT_JAVA_API_KEY=${SF_AGENT_JAVA_API_KEY}
      - SF_AGENT_LOG_LEVEL=WARNING
      - SF_AGENT_STACKEXCHANGE_API_KEY=${SF_AGENT_STACKEXCHANGE_API_KEY:-}
      - SF_AGENT_GITHUB_TOKEN=${SF_AGENT_GITHUB_TOKEN:-}
      - SF_AGENT_MILVUS_HOST=milvus
    depends_on:
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
        reservations: { cpus: "1", memory: "2G" }

  python-inference-2:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - SF_AGENT_APP_ENV=prod
      - SF_AGENT_REDIS_URL=redis://redis-sentinel:26379/0
      - SF_AGENT_JAVA_BASE_URL=http://java-service-2:8200
      - SF_AGENT_LLM_API_KEY=${SF_AGENT_LLM_API_KEY}
      - SF_AGENT_LLM_BASE_URL=${SF_AGENT_LLM_BASE_URL}
      - SF_AGENT_JAVA_API_KEY=${SF_AGENT_JAVA_API_KEY}
      - SF_AGENT_LOG_LEVEL=WARNING
    depends_on:
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }

  # =========================================================================
  # Java Peripheral Service (2 replicas)
  # =========================================================================
  java-service-1: &java-service
    build:
      context: ../shardflow-system
      dockerfile: Dockerfile
    ports:
      - "8081:8200"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-primary:5432/${SF_INFRA_POSTGRES_DB:-shardflow}
      - SPRING_DATASOURCE_USERNAME=${SF_INFRA_POSTGRES_USER:-shardflow}
      - SPRING_DATASOURCE_PASSWORD=${SF_INFRA_POSTGRES_PASSWORD:-shardflow}
      - SPRING_DATA_REDIS_HOST=redis-sentinel
      - SF_SYSTEM_JAVA_API_KEY=${SF_AGENT_JAVA_API_KEY:-}
      - SA_TOKEN_JWT_SECRET_KEY=${SA_TOKEN_JWT_SECRET_KEY:-ShardFlow2026DefaultJwtSecretKeyDoNotUseInProd}
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: "2G" }

  java-service-2:
    <<: *java-service
    ports:
      - "8082:8200"

  # =========================================================================
  # Nginx API Gateway
  # =========================================================================
  nginx-gateway:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../shardflow-system/shardflow-app/src/main/resources/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../shardflow-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - python-inference-1
      - python-inference-2
      - java-service-1
      - java-service-2
    restart: unless-stopped

  # =========================================================================
  # PostgreSQL (primary + replica for HA)
  # =========================================================================
  postgres-primary:
    image: pgvector/pgvector:pg18
    ports:
      - "${SF_INFRA_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${SF_INFRA_POSTGRES_USER:-shardflow}
      POSTGRES_PASSWORD: ${SF_INFRA_POSTGRES_PASSWORD:-shardflow}
      POSTGRES_DB: ${SF_INFRA_POSTGRES_DB:-shardflow}
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ../shardflow-system/shardflow-shard/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shardflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "8G" }

  # =========================================================================
  # Redis Sentinel (3 nodes for HA)
  # =========================================================================
  redis-node-1: &redis-node
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${SF_INFRA_REDIS_PASSWORD:-} --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-node-2:
    <<: *redis-node
    ports:
      - "6380:6379"

  redis-node-3:
    <<: *redis-node
    ports:
      - "6381:6379"

  redis-sentinel:
    image: redis:7-alpine
    ports:
      - "26379:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    restart: unless-stopped

  # =========================================================================
  # MinIO object storage
  # =========================================================================
  minio:
    image: minio/minio:latest
    ports:
      - "${SF_INFRA_MINIO_API_PORT:-9000}:9000"
      - "${SF_INFRA_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${SF_INFRA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SF_INFRA_MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  pg-primary-data:
  minio-data:

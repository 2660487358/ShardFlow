# Production Docker Compose — KnowledgeBridge full stack
version: "3.9"

services:
  # =========================================================================
  # Python推理层 (2 replicas for HA)
  # =========================================================================
  python-inference-1:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=prod
      - REDIS_URL=redis://redis-sentinel:26379/0
      - JAVA_BASE_URL=http://java-service-1:8080
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - JAVA_API_KEY=${JAVA_API_KEY}
      - LOG_LEVEL=WARNING
      - STACKEXCHANGE_API_KEY=${STACKEXCHANGE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
        reservations: { cpus: "1", memory: "2G" }

  python-inference-2:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - APP_ENV=prod
      - REDIS_URL=redis://redis-sentinel:26379/0
      - JAVA_BASE_URL=http://java-service-2:8080
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - JAVA_API_KEY=${JAVA_API_KEY}
      - LOG_LEVEL=WARNING
    depends_on:
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }

  # =========================================================================
  # Java外围服务 (2 replicas)
  # =========================================================================
  java-service-1: &java-service
    build:
      context: ../shardflow-system
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-primary:5432/knowledgebridge
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-knowledgebridge}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-knowledgebridge}
      - SPRING_DATA_REDIS_HOST=redis-sentinel
      - JAVA_API_KEY=${JAVA_API_KEY}
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: "2G" }

  java-service-2:
    <<: *java-service
    ports:
      - "8082:8080"

  # =========================================================================
  # Nginx API Gateway
  # =========================================================================
  nginx-gateway:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./kb-app/src/main/resources/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../shardflow-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - python-inference-1
      - python-inference-2
      - java-service-1
      - java-service-2
    restart: unless-stopped

  # =========================================================================
  # PostgreSQL (primary + replica for HA)
  # =========================================================================
  postgres-primary:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgebridge}
      POSTGRES_DB: knowledgebridge
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ../shardflow-system/kb-shard/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgebridge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "8G" }

  # =========================================================================
  # Redis Sentinel (3 nodes for HA)
  # =========================================================================
  redis-node-1: &redis-node
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-node-2:
    <<: *redis-node
    ports:
      - "6380:6379"

  redis-node-3:
    <<: *redis-node
    ports:
      - "6381:6379"

  redis-sentinel:
    image: redis:7-alpine
    ports:
      - "26379:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    restart: unless-stopped

  # =========================================================================
  # MinIO object storage
  # =========================================================================
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  pg-primary-data:
  minio-data:

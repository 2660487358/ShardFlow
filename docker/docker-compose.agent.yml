services:
  python-inference:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "${SF_AGENT_API_PORT:-8000}:8000"
    environment:
      - SF_AGENT_APP_ENV=dev
      - SF_AGENT_REDIS_URL=redis://redis:6379/0
      - SF_AGENT_JAVA_BASE_URL=http://java-service:8200
      - SF_AGENT_LOG_LEVEL=INFO
      - SF_AGENT_MILVUS_HOST=milvus
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../shardflow-agent/app:/app/app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${SF_INFRA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "${SF_INFRA_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${SF_INFRA_POSTGRES_USER:-shardflow}
      POSTGRES_PASSWORD: ${SF_INFRA_POSTGRES_PASSWORD:-shardflow}
      POSTGRES_DB: ${SF_INFRA_POSTGRES_DB:-shardflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shardflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "${SF_INFRA_MINIO_API_PORT:-9000}:9000"
      - "${SF_INFRA_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${SF_INFRA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SF_INFRA_MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:

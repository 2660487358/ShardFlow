# 生产环境 Docker Compose — ShardFlow 全栈部署
version: "3.9"

services:
  # =========================================================================
  # Python 推理层（2 副本高可用）
  # =========================================================================
  python-inference-1:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - SF_AGENT_APP_ENV=prod
      - SF_AGENT_REDIS_URL=redis://redis-sentinel:26379/0
      - SF_AGENT_JAVA_BASE_URL=http://java-service-1:8200
      - SF_AGENT_LLM_API_KEY=${SF_AGENT_LLM_API_KEY}
      - SF_AGENT_LLM_BASE_URL=${SF_AGENT_LLM_BASE_URL}
      - SF_AGENT_JAVA_API_KEY=${SF_AGENT_JAVA_API_KEY}
      - SF_AGENT_LOG_LEVEL=WARNING
      - SF_AGENT_STACKEXCHANGE_API_KEY=${SF_AGENT_STACKEXCHANGE_API_KEY:-}
      - SF_AGENT_GITHUB_TOKEN=${SF_AGENT_GITHUB_TOKEN:-}
      - SF_AGENT_MILVUS_HOST=milvus
    depends_on:
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
        reservations: { cpus: "1", memory: "2G" }

  python-inference-2:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - SF_AGENT_APP_ENV=prod
      - SF_AGENT_REDIS_URL=redis://redis-sentinel:26379/0
      - SF_AGENT_JAVA_BASE_URL=http://java-service-2:8200
      - SF_AGENT_LLM_API_KEY=${SF_AGENT_LLM_API_KEY}
      - SF_AGENT_LLM_BASE_URL=${SF_AGENT_LLM_BASE_URL}
      - SF_AGENT_JAVA_API_KEY=${SF_AGENT_JAVA_API_KEY}
      - SF_AGENT_LOG_LEVEL=WARNING
    depends_on:
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }

  # =========================================================================
  # Java 外围服务（2 副本）
  # =========================================================================
  java-service-1: &java-service
    build:
      context: ../shardflow-system
      dockerfile: Dockerfile
    ports:
      - "8081:8200"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${SF_INFRA_MYSQL_DATABASE:-shardflow}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=${SF_INFRA_MYSQL_USER:-shardflow}
      - SPRING_DATASOURCE_PASSWORD=${SF_INFRA_MYSQL_PASSWORD:-shardflow}
      - SPRING_DATA_REDIS_HOST=redis-sentinel
      - SF_SYSTEM_JAVA_API_KEY=${SF_AGENT_JAVA_API_KEY:-}
      - SA_TOKEN_JWT_SECRET_KEY=${SA_TOKEN_JWT_SECRET_KEY:-ShardFlow2026DefaultJwtSecretKeyDoNotUseInProd}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: "2G" }

  java-service-2:
    <<: *java-service
    ports:
      - "8082:8200"

  # =========================================================================
  # Nginx API 网关
  # =========================================================================
  nginx-gateway:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../shardflow-system/shardflow-app/src/main/resources/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../shardflow-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - python-inference-1
      - python-inference-2
      - java-service-1
      - java-service-2
    restart: unless-stopped

  # =========================================================================
  # MySQL（业务数据）
  # =========================================================================
  mysql:
    image: mysql:8.0
    ports:
      - "${SF_INFRA_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SF_INFRA_MYSQL_ROOT_PASSWORD:-shardflow}
      MYSQL_DATABASE: ${SF_INFRA_MYSQL_DATABASE:-shardflow}
      MYSQL_USER: ${SF_INFRA_MYSQL_USER:-shardflow}
      MYSQL_PASSWORD: ${SF_INFRA_MYSQL_PASSWORD:-shardflow}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: "2G" }

  # =========================================================================
  # Redis Sentinel（3 节点高可用）
  # =========================================================================
  redis-node-1: &redis-node
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${SF_INFRA_REDIS_PASSWORD:-} --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-node-2:
    <<: *redis-node
    ports:
      - "6380:6379"

  redis-node-3:
    <<: *redis-node
    ports:
      - "6381:6379"

  redis-sentinel:
    image: redis:7-alpine
    ports:
      - "26379:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    restart: unless-stopped

  # =========================================================================
  # MinIO 对象存储
  # =========================================================================
  minio:
    image: minio/minio:latest
    ports:
      - "${SF_INFRA_MINIO_API_PORT:-9000}:9000"
      - "${SF_INFRA_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${SF_INFRA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SF_INFRA_MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:

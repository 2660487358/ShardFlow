version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shardflow
      POSTGRES_PASSWORD: shardflow
      POSTGRES_DB: shardflow
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../shardflow-system/shardflow-shard/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shardflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  java:
    build:
      context: ../shardflow-system
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shardflow
      SPRING_DATASOURCE_USERNAME: shardflow
      SPRING_DATASOURCE_PASSWORD: shardflow
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  python:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      REDIS_URL: redis://redis:6379/0
      SHARDFLOW_JAVA_BASE_URL: http://java:8200
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      JAVA_API_KEY: ${JAVA_API_KEY}
      LOG_LEVEL: INFO
    depends_on:
      java:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../shardflow-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_AUTH_BASE_URL: http://localhost:8080
    depends_on:
      - python
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4
    ports:
      - "${SF_MILVUS_PORT:-19530}:19530"
      - "${SF_MILVUS_GRPC_PORT:-9091}:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ROOT_USER: ${SF_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SF_MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "${SF_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SF_MYSQL_ROOT_PASSWORD:-shardflow}
      MYSQL_DATABASE: ${SF_MYSQL_DATABASE:-shardflow}
      MYSQL_USER: ${SF_MYSQL_USER:-shardflow}
      MYSQL_PASSWORD: ${SF_MYSQL_PASSWORD:-shardflow}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg-data:
  milvus-data:
  etcd-data:
  minio-data:
  mysql-data:

version: "3.9"

services:
  redis:
    image: redis:7.4
    ports:
      - "${SF_INFRA_REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  java:
    build:
      context: ../shardflow-system
      dockerfile: Dockerfile
    ports:
      - "${SF_SYSTEM_SERVER_PORT:-8200}:8200"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${SF_INFRA_MYSQL_DATABASE:-shardflow}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${SF_INFRA_MYSQL_USER:-shardflow}
      SPRING_DATASOURCE_PASSWORD: ${SF_INFRA_MYSQL_PASSWORD:-shardflow}
      SPRING_DATA_REDIS_HOST: redis
      SF_JAVA_API_KEY: ${SF_JAVA_API_KEY:-}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:-ShardFlow2026DefaultJwtSecretKeyDoNotUseInProd}
      SF_MODEL_KEY_MASTER: ${SF_MODEL_KEY_MASTER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  python:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "${SF_AGENT_API_PORT:-8000}:8000"
    environment:
      SF_AGENT_APP_ENV: dev
      SF_AGENT_REDIS_URL: redis://redis:6379/0
      SF_AGENT_JAVA_BASE_URL: http://java:8200
      SF_AGENT_LLM_API_KEY: ${SF_AGENT_LLM_API_KEY:-}
      SF_AGENT_LLM_BASE_URL: ${SF_AGENT_LLM_BASE_URL:-}
      SF_AGENT_JAVA_API_KEY: ${SF_AGENT_JAVA_API_KEY:-}
      SF_AGENT_LOG_LEVEL: INFO
      SF_AGENT_MILVUS_HOST: milvus
      SF_AGENT_MODEL_KEY_MASTER: ${SF_MODEL_KEY_MASTER:-}
      SF_AGENT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SF_AGENT_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SF_AGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SF_AGENT_AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    depends_on:
      java:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../shardflow-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_SF_API_BASE_URL: http://localhost:${SF_AGENT_API_PORT:-8000}
      VITE_SF_AUTH_BASE_URL: http://localhost:${SF_SYSTEM_SERVER_PORT:-8200}
    depends_on:
      - python
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4
    ports:
      - "${SF_INFRA_MILVUS_PORT:-19530}:19530"
      - "${SF_INFRA_MILVUS_GRPC_PORT:-9091}:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ROOT_USER: ${SF_INFRA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SF_INFRA_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mysql:
    image: mysql:8.0.33
    ports:
      - "${SF_INFRA_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SF_INFRA_MYSQL_ROOT_PASSWORD:-shardflow}
      MYSQL_DATABASE: ${SF_INFRA_MYSQL_DATABASE:-shardflow}
      MYSQL_USER: ${SF_INFRA_MYSQL_USER:-shardflow}
      MYSQL_PASSWORD: ${SF_INFRA_MYSQL_PASSWORD:-shardflow}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  milvus-data:
  etcd-data:
  minio-data:
  mysql-data:

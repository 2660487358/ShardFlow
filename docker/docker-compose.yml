version: "3.9"

services:
  redis:
    image: redis:7.4
    ports:
      - "${SF_INFRA_REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${SF_INFRA_RABBITMQ_PORT:-5672}:5672"
      - "${SF_INFRA_RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${SF_INFRA_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${SF_INFRA_RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  java:
    build:
      context: ../shardflow-system
      dockerfile: Dockerfile
    ports:
      - "${SF_SYSTEM_SERVER_PORT:-8200}:8200"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SF_INFRA_POSTGRES_DATABASE:-shardflow}?currentSchema=public&stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${SF_INFRA_POSTGRES_USER:-shardflow}
      SPRING_DATASOURCE_PASSWORD: ${SF_INFRA_POSTGRES_PASSWORD:-shardflow}
      SPRING_DATA_REDIS_HOST: redis
      SF_JAVA_API_KEY: ${SF_JAVA_API_KEY:-}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:-ShardFlow2026DefaultJwtSecretKeyDoNotUseInProd}
      SF_MODEL_KEY_MASTER: ${SF_MODEL_KEY_MASTER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      SF_RABBITMQ_HOST: rabbitmq
      SF_RABBITMQ_PORT: 5672
      SF_RABBITMQ_USERNAME: ${SF_INFRA_RABBITMQ_USER:-guest}
      SF_RABBITMQ_PASSWORD: ${SF_INFRA_RABBITMQ_PASS:-guest}
      SF_GRPC_PYTHON_HOST: python
      SF_GRPC_PYTHON_PORT: 50051
      SF_MINIO_ENDPOINT: http://minio:9000
      SF_MILVUS_HOST: milvus
      SF_MILVUS_PORT: 19530
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  python:
    build:
      context: ../shardflow-agent
      dockerfile: docker/Dockerfile
    ports:
      - "${SF_AGENT_API_PORT:-8000}:8000"
    environment:
      SF_AGENT_APP_ENV: dev
      SF_AGENT_REDIS_URL: redis://redis:6379/0
      SF_AGENT_JAVA_BASE_URL: http://java:8200
      SF_AGENT_LLM_API_KEY: ${SF_AGENT_LLM_API_KEY:-}
      SF_AGENT_LLM_BASE_URL: ${SF_AGENT_LLM_BASE_URL:-}
      SF_AGENT_JAVA_API_KEY: ${SF_AGENT_JAVA_API_KEY:-}
      SF_AGENT_LOG_LEVEL: INFO
      SF_AGENT_MILVUS_HOST: milvus
      SF_AGENT_MODEL_KEY_MASTER: ${SF_MODEL_KEY_MASTER:-}
      SF_AGENT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SF_AGENT_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SF_AGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SF_AGENT_AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      SF_AGENT_RABBITMQ_HOST: rabbitmq
      SF_AGENT_RABBITMQ_PORT: 5672
      SF_AGENT_RABBITMQ_USER: ${SF_INFRA_RABBITMQ_USER:-guest}
      SF_AGENT_RABBITMQ_PASSWORD: ${SF_INFRA_RABBITMQ_PASS:-guest}
      SF_AGENT_MINIO_ENDPOINT: minio:9000
    depends_on:
      java:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../shardflow-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_SF_API_BASE_URL: http://localhost:${SF_AGENT_API_PORT:-8000}
      VITE_SF_AUTH_BASE_URL: http://localhost:${SF_SYSTEM_SERVER_PORT:-8200}
    depends_on:
      - python
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4
    ports:
      - "${SF_INFRA_MILVUS_PORT:-19530}:19530"
      - "${SF_INFRA_MILVUS_GRPC_PORT:-9091}:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    ports:
      - "${SF_INFRA_MINIO_PORT:-9000}:9000"
      - "${SF_INFRA_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${SF_INFRA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SF_INFRA_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "${SF_INFRA_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${SF_INFRA_POSTGRES_DATABASE:-shardflow}
      POSTGRES_USER: ${SF_INFRA_POSTGRES_USER:-shardflow}
      POSTGRES_PASSWORD: ${SF_INFRA_POSTGRES_PASSWORD:-shardflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SF_INFRA_POSTGRES_USER:-shardflow} -d ${SF_INFRA_POSTGRES_DATABASE:-shardflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0.33
    ports:
      - "${SF_INFRA_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SF_INFRA_MYSQL_ROOT_PASSWORD:-shardflow}
      MYSQL_DATABASE: ${SF_INFRA_MYSQL_DATABASE:-shardflow}
      MYSQL_USER: ${SF_INFRA_MYSQL_USER:-shardflow}
      MYSQL_PASSWORD: ${SF_INFRA_MYSQL_PASSWORD:-shardflow}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${SF_INFRA_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - java
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${SF_INFRA_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${SF_INFRA_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SF_INFRA_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  milvus-data:
  etcd-data:
  minio-data:
  mysql-data:
  postgres-data:
  prometheus-data:
  grafana-data:
